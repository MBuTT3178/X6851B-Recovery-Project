name: OrangeFox Recovery - Infinix Note 40 Pro+ 5G (X6851B) Android 16

on:
  workflow_dispatch:
    inputs:
      SYNC_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-16'

jobs:
  build:
    name: Build OrangeFox A16 for X6851B
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2 libxml2-utils xsltproc unzip fontconfig zstd libzstd-dev python3-pip
          pip3 install zstandard lz4

      - name: Sync OrangeFox 14.1
        run: |
          mkdir -p ~/fox_14.1 && cd ~/fox_14.1
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync
          ~/OrangeFox_sync/orangefox_sync.sh --branch ${{ github.event.inputs.SYNC_BRANCH }} --path ~/fox_14.1

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: ~/fox_14.1/device/infinix/X6851B

      - name: Build Recovery Ramdisk
        run: |
          cd ~/fox_14.1
          source build/envsetup.sh
          source device/infinix/X6851B/vendorsetup.sh
          lunch twrp_X6851B-ap2a-eng
          mka adbd vendorbootimage -j$(nproc)

      - name: Repack Dual ZSTD vendor_boot (<=64MB Boundary)
        run: |
          python3 ~/fox_14.1/device/infinix/X6851B/scripts/repack_vendor_boot_a16.py \
            ~/fox_14.1/device/infinix/X6851B/prebuilt/stock_vendor_boot.img \
            ~/fox_14.1/out/target/product/X6851B/ramdisk-recovery.cpio \
            ~/fox_14.1/out/target/product/X6851B/vendor_boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X6851B-XOS16-vendor_boot
          path: ~/fox_14.1/out/target/product/X6851B/vendor_boot.img
